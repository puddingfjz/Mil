notes:
- Plots read measurements explicitly supplied by the user; no prior experiment results
  are bundled.
- HybridFlow uses the retained pre-9011731 function; HybridFlow* uses the Round2 no-colocate
  implementation.
- Scalability model_replicate_num multiplies the two base applications; 1/2/4 is displayed
  as 2/4/8 applications.
- The legacy ablation combines one Router point and one Mixed point; it is an extension,
  not paper Table 2.
plot_entry: artifact.mil_artifact.plot_entry
plot_mode: results
