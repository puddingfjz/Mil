  compare_table: benchmarks/get_my_cost_table_directly_zxcpu.py
  coefficient_table: benchmarks/model_coeff_database.py
  entries:
    - model: THUDM/chatglm3-6b
      exec_plan: [1, 0.9, 2, 0]
      log: benchmarks/Cost_Model_per_iter_zxcpu/NEWROUND_chatglm3-6b_tp1_1202_temp1.0_wldeg2_1.log
    - model: THUDM/chatglm3-6b
      exec_plan: [2, 0.9, 2, 0]
      log: benchmarks/Cost_Model_per_iter_zxcpu/NEWROUND_chatglm3-6b_tp2_1202_temp1.0_wldeg2_1.log
    - model: stabilityai/stablelm-tuned-alpha-7b
      exec_plan: [1, 0.9, 2, 0]
      log: benchmarks/Cost_Model_per_iter_zxcpu/NEWROUND_stablelm-tuned-alpha-7b_tp1_1202_temp1.0_wldeg2_1.log
    - model: stabilityai/stablelm-tuned-alpha-7b
      exec_plan: [2, 0.9, 2, 0]
      log: benchmarks/Cost_Model_per_iter_zxcpu/NEWROUND_stablelm-tuned-alpha-7b_tp2_1202_temp1.0_wldeg2_1.log
output_lengths:
