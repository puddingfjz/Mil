notes:
- Native Conda is the primary route; Docker is optional and has not been built for
  this release.
- Rebuild and validate the GPU extension from this source before GPU experiments;
  installed editable metadata may describe another revision.
- The custom_vllm entry requires this repository's modified Python and native code.
  Never replace it with an official vLLM wheel, even with the same version label.
- Saturn requires a separately provisioned Gurobi license; no alternate solver is
  substituted.
